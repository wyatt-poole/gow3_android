# Keeps this Android fork up to date with the PC port (github.com/FelipePrado0/gow3_pc): every day
# (or on demand) upstream main is merged into the branch upstream-sync, checked with
# android/scripts/check.sh, and offered as a pull request into main. A merge with conflicts fails
# this job with the list of files; resolve it locally with android/sync-upstream.sh.
name: Android - sync upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/FelipePrado0/gow3_pc.git
          git fetch --quiet upstream main
          new=$(git rev-list --count HEAD..upstream/main)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = 0 ]; then echo 'Up to date.'; exit 0; fi
          git checkout -B upstream-sync
          if ! git merge --no-edit -m 'Merge upstream gow3_pc (main) into the Android fork' upstream/main; then
            echo '::error::Upstream does not merge cleanly. Conflicts:'
            git diff --name-only --diff-filter=U
            echo 'Run android/sync-upstream.sh locally to resolve them.'
            exit 1
          fi
      - name: Install build tools
        if: steps.merge.outputs.new != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm pkg-config
      - uses: actions/cache@v4
        if: steps.merge.outputs.new != '0'
        with:
          path: |
            out/android/arm64-debs
            out/android/amd64-debs
            out/android/sdk
          key: android-deps-${{ hashFiles('android/scripts/fetch_sysroot.py', 'android/scripts/fetch_sdk.sh') }}
      - uses: actions/setup-java@v4
        if: steps.merge.outputs.new != '0'
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the Android build
        if: steps.merge.outputs.new != '0'
        run: |
          git submodule update --init --recursive gpu/third_party/imgui third_party/LibAtrac9
          bash android/scripts/check.sh
      - name: Open or update the pull request
        if: steps.merge.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin upstream-sync
          body="Merges ${{ steps.merge.outputs.new }} new commit(s) of [gow3_pc](https://github.com/FelipePrado0/gow3_pc) main. android/scripts/check.sh passed (runtime for ARM64 and x86-64, Android app, scripts)."
          if [ -z "$(gh pr list --head upstream-sync --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head upstream-sync --title 'Sync with upstream gow3_pc' --body "$body"
          else
            gh pr edit upstream-sync --body "$body"
          fi
