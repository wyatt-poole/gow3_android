# Keeps this Android fork up to date with the PC port (github.com/FelipePrado0/gow3_pc): every day
# (or on demand) upstream main is merged into the branch upstream-sync, checked with
# android/scripts/check.sh, and offered as a pull request into main. A merge with conflicts fails
# this job with the list of files; resolve it locally with android/sync-upstream.sh.
#
# Token: the workflow's own token cannot push a merge that changes upstream's workflow files
# (.github/workflows), and new repositories do not let it open pull requests. Add a repository
# secret SYNC_TOKEN (a fine-grained personal access token for this repository with Contents,
# Pull requests and Workflows read/write) and every sync goes through. Without it, a sync the
# token cannot push opens an issue asking for android/sync-upstream.sh to be run by hand.
name: Android - sync upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge upstream main
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/FelipePrado0/gow3_pc.git
          git fetch --quiet upstream main
          new=$(git rev-list --count HEAD..upstream/main)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = 0 ]; then echo 'Up to date.'; exit 0; fi
          git checkout -B upstream-sync
          if ! git merge --no-edit -m 'Merge upstream gow3_pc (main) into the Android fork' upstream/main; then
            echo '::error::Upstream does not merge cleanly. Conflicts:'
            git diff --name-only --diff-filter=U
            echo 'Run android/sync-upstream.sh locally to resolve them.'
            exit 1
          fi
      - name: Install build tools
        if: steps.merge.outputs.new != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm pkg-config
      - uses: actions/cache@v4
        if: steps.merge.outputs.new != '0'
        with:
          path: |
            out/android/arm64-debs
            out/android/amd64-debs
            out/android/sdk
          key: android-deps-${{ hashFiles('android/scripts/fetch_sysroot.py', 'android/scripts/fetch_sdk.sh') }}
      - uses: actions/setup-java@v4
        if: steps.merge.outputs.new != '0'
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the Android build
        if: steps.merge.outputs.new != '0'
        run: |
          git submodule update --init --recursive gpu/third_party/imgui third_party/LibAtrac9
          bash android/scripts/check.sh
      - name: Open or update the pull request
        if: steps.merge.outputs.new != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          NEW: ${{ steps.merge.outputs.new }}
        run: |
          body="Merges $NEW new commit(s) of [gow3_pc](https://github.com/FelipePrado0/gow3_pc) main. android/scripts/check.sh passed (runtime for ARM64 and x86-64, Android app, scripts)."
          if git push --force origin upstream-sync 2> push.log &&
             { [ -n "$(gh pr list --head upstream-sync --state open --json number --jq '.[0].number')" ] &&
                 gh pr edit upstream-sync --body "$body" ||
               gh pr create --base main --head upstream-sync --title 'Sync with upstream gow3_pc' --body "$body"; } 2>> push.log
          then
            exit 0
          fi
          cat push.log
          # The token could not push (upstream changed its workflow files) or open the pull request:
          # one open issue says so, updated on later runs.
          reason="The merge itself is clean and the Android check passed, but this workflow's token could not push it or open the pull request:"
          text=$(printf '%s\n\n```\n%s\n```\n\nRun `android/sync-upstream.sh` on a clone and push, or add the SYNC_TOKEN secret (see .github/workflows/android-upstream-sync.yml).' "$reason $NEW new upstream commit(s) are waiting." "$(tail -n 5 push.log)")
          export GH_TOKEN=$ISSUE_TOKEN
          number=$(gh issue list --state open --search 'Upstream sync needs a manual merge in:title' --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body "$text"
          else gh issue create --title 'Upstream sync needs a manual merge' --body "$text"; fi
          echo '::warning::Upstream sync could not be pushed with this token; an issue says what to do.'
